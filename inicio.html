<!-- Instalable en el telefono. El NOMBRE que queda bajo el icono lo
     decide cada sistema: Android lo lee del manifiesto y iOS de
     `apple-mobile-web-app-title`, asi que los dos tienen que decir lo
     mismo o la app se llama distinto segun el aparato. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="18-Z">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#120a10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Pixelify+Sans:wght@400;700&display=swap">
<style>
/* ===================================================================
   ZOMBIES EN EL 18 — pantalla de inicio
   Guia visual del juego. La paleta sale del propio video: brasa,
   ceniza y cielo morado. Verde y rojo son los del logotipo. El oro
   queda reservado para lo unico que se puede tocar.
   =================================================================== */
:root{
  --ash:#120a10; --ember:#ff8a1e; --ember-hi:#ffc46a;
  --toxic:#6fd12b; --blood:#d8232a; --gold:#ffc233;
  --bone:#ffeccd; --dim:#c2a288;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
body{
  font-family:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  color:var(--bone);-webkit-font-smoothing:none;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
img,video{max-width:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}

#backdrop{
  position:fixed;inset:-5%;
  background:#0b0509 url("assets/intro-frame0.webp") center/cover no-repeat;
  filter:blur(32px) saturate(.7) brightness(.28);
}
#stage{
  position:fixed;left:50%;top:50%;width:960px;height:540px;will-change:width;
  transform-origin:50% 50%;transform:translate(-50%,-50%);
  background:#0b0509;overflow:hidden;
  box-shadow:0 0 0 2px #000,0 0 70px rgba(0,0,0,.95),0 0 130px rgba(255,110,30,.14);
}

/* ---------- capas de fondo ---------- */
#vid,#anim,#still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#anim{opacity:0;transition:opacity .25s}
#anim.on{opacity:1}
#still{opacity:0;transition:opacity .45s ease;will-change:transform}
#still.on{opacity:1;animation:push 30s ease-in-out infinite alternate}
@keyframes push{from{transform:scale(1.006)}to{transform:scale(1.058)}}
#vid.gone,#anim.gone{opacity:0;transition:opacity .3s}
/* el fuego se anima encima del cuadro fijo */
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .8s ease .2s}
#fx.on{opacity:1}

.atmos{position:absolute;inset:0;pointer-events:none}
.atmos.heat{
  background:radial-gradient(ellipse 82% 60% at 50% 116%,rgba(255,126,26,.38),transparent 70%);
  mix-blend-mode:screen;animation:heat 3.4s ease-in-out infinite alternate;
}
@keyframes heat{from{opacity:.36}to{opacity:1}}
.atmos.sky{background:linear-gradient(180deg,rgba(26,8,28,.6),transparent 30%,transparent 58%,rgba(10,4,9,.78))}
.atmos.vig{background:radial-gradient(ellipse 78% 70% at 50% 46%,transparent 40%,rgba(0,0,0,.8) 100%)}
#crt{position:fixed;inset:0;pointer-events:none;z-index:70}
#crt::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.3) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;opacity:.5;
}

/* ---------- tarjeta de titulo ---------- */
#title{position:absolute;inset:0;pointer-events:none}
#logoWrap{position:absolute;left:308px;top:6px;width:344px;height:205px;opacity:0;
  will-change:transform,opacity}
/* Dos animaciones a la vez: el viaje es largo y con un asentamiento
   suave; la opacidad se resuelve al principio, para que se lea como un
   deslizamiento y no como una aparicion. */
#logoWrap.in{animation:logoDrop .96s cubic-bezier(.17,.88,.25,1.04) both,
                       fadeIn .32s ease-out both}
@keyframes logoDrop{from{transform:translateY(-215px)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#logoWrap img{width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.6)) drop-shadow(0 0 24px rgba(255,120,30,.42))}
#shine{
  position:absolute;inset:0;
  -webkit-mask:url("assets/logo.webp") center/contain no-repeat;
  mask:url("assets/logo.webp") center/contain no-repeat;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.9) 48%,rgba(255,235,190,.48) 54%,transparent 62%);
  background-size:260% 100%;background-position:180% 0;mix-blend-mode:screen;opacity:0;
}
#logoWrap.in #shine{animation:shine 5s ease-in-out 1.15s infinite}
@keyframes shine{
  0%{background-position:180% 0;opacity:0} 6%{opacity:1}
  26%{background-position:-90% 0;opacity:1} 32%{opacity:0}
  100%{background-position:-90% 0;opacity:0}
}

#cast{position:absolute;inset:0;pointer-events:none}
.fig{position:absolute;opacity:0;will-change:transform,opacity}
/* la sombra difusa vive en la imagen, que no se anima: el navegador la
   calcula una vez y despues solo mueve la capa */
.fig img{width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.72)) drop-shadow(0 0 22px rgba(255,120,30,.22))}
.fig .sway{position:absolute;inset:0;will-change:transform}
/* suben desde fuera del cuadro y se juntan un poco hacia el centro */
.fig.in{animation:figRise .98s cubic-bezier(.17,.88,.25,1.05) both,
                  fadeIn .36s ease-out both}
@keyframes figRise{
  from{transform:translate(var(--dx,0px),136px)}
  to{transform:translate(0px,0px)}
}
@keyframes sway{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.fsh{position:absolute;border-radius:50%;opacity:0;transition:opacity .55s ease;
  background:radial-gradient(ellipse,rgba(0,0,0,.6),rgba(0,0,0,.2) 55%,transparent 72%)}
.fsh.in{opacity:1}

/* ---------- barra inferior ---------- */
#bar{
  position:absolute;left:0;right:0;bottom:0;height:86px;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(10,4,9,.42) 50%,rgba(8,3,7,.8));
  opacity:0;transition:opacity .5s ease .55s;
}
#bar.in{opacity:1;transition:opacity .6s ease .75s}
#cta{
  position:absolute;left:50%;top:487px;transform:translateX(-50%);
  display:flex;align-items:center;gap:13px;padding:9px 32px;border-radius:10px;
  background:linear-gradient(180deg,rgba(158,20,26,.96),rgba(94,8,12,.96));
  border:3px solid rgba(255,196,106,.85);
  box-shadow:0 4px 0 rgba(40,4,6,.9),0 10px 26px rgba(0,0,0,.68),inset 0 1px 0 rgba(255,210,150,.42);
  font-family:Bungee,Impact,sans-serif;font-size:21px;letter-spacing:.07em;
  color:#fff3dc;text-shadow:0 2px 0 #5c070b,0 0 18px rgba(255,150,60,.85);
  opacity:0;white-space:nowrap;pointer-events:none;
}
#cta.in{animation:ctaIn .5s ease 1.38s forwards, ctaBlink 1.2s steps(1,end) 1.95s infinite}
@keyframes ctaIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes ctaBlink{0%,66%{opacity:1}67%,100%{opacity:.22}}
#cta .st{color:var(--gold);font-size:18px;text-shadow:0 0 14px rgba(255,194,51,.9)}
#ctaGlow{
  position:absolute;left:50%;top:489px;width:330px;height:48px;transform:translateX(-50%);
  border-radius:12px;box-shadow:0 0 36px 10px rgba(255,140,40,.42);opacity:0;pointer-events:none;
}
#ctaGlow.in{animation:glowIn .55s ease 1.32s forwards, glowPulse 1.2s ease-in-out 1.98s infinite}
@keyframes glowIn{to{opacity:1}}
@keyframes glowPulse{0%,100%{opacity:.3}50%{opacity:1}}
#credits{
  position:absolute;left:16px;bottom:11px;font-size:11px;letter-spacing:.14em;
  color:var(--dim);text-shadow:0 1px 0 #000;opacity:0;transition:opacity .6s ease 1.5s;
}
#credits.in{opacity:1}
#credits b{color:var(--toxic)}

/* ---------- controles: grandes, y su zona se traga el toque ---------- */
/* arriba a la derecha: abajo se sentaban encima de La Naya */
#tools{
  position:absolute;right:0;top:0;z-index:46;
  display:flex;align-items:center;gap:20px;padding:12px 12px 20px 22px;
  opacity:1;pointer-events:auto;
}
#tools button{
  position:relative;width:78px;height:78px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(12,5,9,.78);border:3px solid rgba(255,138,30,.5);
  box-shadow:0 3px 0 rgba(0,0,0,.65),0 0 18px rgba(0,0,0,.5);
  transition:border-color .18s, background .18s, transform .09s;
  touch-action:manipulation;
}
/* el dedo es mas grande que el dibujo: el area que responde se extiende
   10 px por fuera del circulo, sin cambiar lo que se ve */
#tools button::after{content:"";position:absolute;inset:-10px;border-radius:50%}
#tools button:active{transform:scale(.9);background:rgba(40,18,10,.92)}
#sndBtn svg{width:38px;height:38px;display:block;pointer-events:none}
#sndBtn .body{fill:var(--ember-hi)}
#sndBtn .wave{stroke:var(--ember-hi);stroke-width:2;fill:none;stroke-linecap:round;opacity:0}
#sndBtn .slash{stroke:#ff7a7a;stroke-width:2.6;stroke-linecap:round}
#sndBtn.locked{border-color:rgba(255,160,50,.9)}
/* silenciado a proposito: apagado y sin llamar la atencion */
#tools #sndBtn.muted{border-color:rgba(226,214,200,.34);background:rgba(10,4,8,.68);animation:none}
#sndBtn.muted .body{fill:#9aa3b0}
#sndBtn.muted .slash{stroke:#c0707a}
/* mientras el navegador no deja sonar, la bocina llama la atencion sola:
   es el unico camino para encender el audio y tiene que verse */
#sndBtn.locked{animation:sndCall 1.6s ease-in-out infinite}
@keyframes sndCall{
  0%,100%{box-shadow:0 3px 0 rgba(0,0,0,.65),0 0 0 0 rgba(255,138,30,.6)}
  55%{box-shadow:0 3px 0 rgba(0,0,0,.65),0 0 0 14px rgba(255,138,30,0)}
}
#sndBtn.on{border-color:rgba(111,209,43,.8);background:rgba(16,32,10,.82);animation:none}
#sndBtn.on .body{fill:var(--toxic)}
#sndBtn.on .wave{stroke:var(--toxic);opacity:1;animation:waveOn 1.6s ease-in-out infinite}
#sndBtn.on .slash{opacity:0}
@keyframes waveOn{0%,100%{opacity:.45}50%{opacity:1}}
/* mas especifico que "#tools button", si no le gana el borde naranjo */
#tools #replayBtn{border-color:rgba(226,214,200,.3);background:rgba(10,4,8,.62);
  box-shadow:0 3px 0 rgba(0,0,0,.6)}
#replayBtn svg{width:34px;height:34px;fill:none;stroke:rgba(255,236,205,.72);
  stroke-width:2.2;stroke-linecap:round;pointer-events:none}

/* ---------- destello ---------- */
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:40;
  background:radial-gradient(circle at 50% 44%,#fff 0%,rgba(255,214,150,.9) 22%,rgba(255,130,30,.48) 48%,transparent 74%)}
#flash.go{animation:flashGo .75s ease-out}
@keyframes flashGo{0%{opacity:0}7%{opacity:1}42%{opacity:.48}100%{opacity:0}}
#ring{position:absolute;left:50%;top:44%;width:60px;height:60px;margin:-30px 0 0 -30px;
  border:4px solid rgba(255,220,170,.9);border-radius:50%;opacity:0;pointer-events:none;z-index:41}
#ring.go{animation:ringGo .8s cubic-bezier(.1,.8,.3,1)}
@keyframes ringGo{0%{opacity:.95;transform:scale(.2)}100%{opacity:0;transform:scale(15)}}


/* ===================================================================
   SELECCION DE PERSONAJE
   El modulo es una sola imagen. La grilla y el panel derecho salen de
   ella con dos recortes complementarios: asi la cortina puede bajar
   sola sin partir el archivo en dos y sin costura visible al final.
   =================================================================== */
#pg-sel{position:absolute;inset:0;opacity:0;visibility:hidden}
#pg-sel.on{opacity:1;visibility:visible}
#selBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  animation:selPush 40s ease-in-out infinite alternate;will-change:transform}
@keyframes selPush{from{transform:scale(1.02)}to{transform:scale(1.09)}}
#selFx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;
  transition:opacity .5s ease .12s}
#selFx.on{opacity:1}
#pg-sel .dim{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 60% at 50% 45%,rgba(4,2,8,.28),rgba(4,2,8,.72))}

#selMod{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  height:100%;aspect-ratio:1672/941}
#selMod.shake{animation:modShake .34s cubic-bezier(.36,.07,.19,.97)}
@keyframes modShake{
  0%,100%{transform:translate(-50%,-50%)}
  18%{transform:translate(calc(-50% - 4px),calc(-50% + 5px))}
  42%{transform:translate(calc(-50% + 4px),calc(-50% - 3px))}
  68%{transform:translate(calc(-50% - 2px),calc(-50% + 2px))}
}
.modImg{position:absolute;inset:0;background:url("assets/sel-mod.webp") center/100% 100% no-repeat}
.modR{clip-path:inset(0 0 0 65.371%)}
.modL{clip-path:inset(0 34.629% 0 0)}

/* --- la cortina metalica --- */
#curtain{position:absolute;inset:0;clip-path:inset(0 34.629% 100% 0)}
#curtain.roll{animation:curtainDown 1.18s forwards}
@keyframes curtainDown{
  0%{clip-path:inset(0 34.629% 100% 0);animation-timing-function:cubic-bezier(.45,0,.85,.5)}
  74%{clip-path:inset(0 34.629% 0% 0);animation-timing-function:cubic-bezier(.3,0,.5,1)}
  85%{clip-path:inset(0 34.629% 3.6% 0);animation-timing-function:cubic-bezier(.4,0,.25,1)}
  100%{clip-path:inset(0 34.629% 0% 0)}
}
/* las lamas: dan la lectura de persiana mientras baja y despues se van */
#slats{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:repeating-linear-gradient(180deg,
    rgba(0,0,0,.42) 0 2px, rgba(170,200,255,.09) 2px 3px, transparent 3px 12px)}
#curtain.roll #slats{animation:slatsFade 1.18s ease-out forwards}
@keyframes slatsFade{0%{opacity:.85}62%{opacity:.62}100%{opacity:0}}
/* el riel que va al filo de la cortina */
#rail{position:absolute;left:0;width:65.371%;height:11px;top:0;margin-top:-6px;opacity:0;
  pointer-events:none;border-radius:3px;
  background:linear-gradient(180deg,#f7e2b4,#c98a2e 42%,#6b3b0d 70%,#1a0d04);
  box-shadow:0 0 18px 4px rgba(255,150,40,.55),0 6px 22px rgba(0,0,0,.7)}
#rail.roll{animation:railDown 1.18s forwards}
@keyframes railDown{
  0%{top:0;opacity:1;animation-timing-function:cubic-bezier(.45,0,.85,.5)}
  74%{top:100%;animation-timing-function:cubic-bezier(.3,0,.5,1)}
  85%{top:96.4%;animation-timing-function:cubic-bezier(.4,0,.25,1)}
  97%{top:100%;opacity:1}
  100%{top:100%;opacity:0}
}

/* --- casillas --- */
#slots{position:absolute;inset:0}
.slot{position:absolute;padding:0;border:0;background:none;border-radius:7px;
  overflow:hidden;cursor:pointer;touch-action:manipulation}
.slot img{width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .25s ease, filter .25s ease}
.slot.lock{cursor:default}
.slot.free:hover img{transform:scale(1.06)}
.slot.free::after{content:"";position:absolute;inset:0;border-radius:6px;
  box-shadow:inset 0 0 0 2px rgba(255,200,90,0);transition:box-shadow .2s}
.slot.free:hover::after{box-shadow:inset 0 0 0 2px rgba(255,200,90,.55)}
.slot.sel img{filter:saturate(1.22) brightness(1.14) contrast(1.05);transform:scale(1.04)}
.slot.sel::after{box-shadow:inset 0 0 0 2px var(--gold),inset 0 0 12px 2px rgba(255,194,51,.5)}
/* el resplandor va de filtro y no de sombra: la casilla recorta lo suyo
   (lo necesita para redondear la cara) y una sombra exterior no saldria */
.slot.sel{animation:slotPop .34s cubic-bezier(.2,1.5,.4,1);
  filter:drop-shadow(0 0 7px rgba(255,194,51,.95)) drop-shadow(0 0 16px rgba(255,140,30,.6))}
@keyframes slotPop{0%{transform:scale(.9)}100%{transform:scale(1)}}
.slot.no{animation:slotNo .3s}
@keyframes slotNo{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.plate{position:absolute;display:flex;align-items:center;justify-content:center;
  font-family:Bungee,Impact,sans-serif;letter-spacing:.02em;color:#ffe9c4;
  text-shadow:0 1px 0 #000,0 0 8px rgba(255,150,50,.5);
  white-space:nowrap;overflow:hidden;pointer-events:none}
.plate.sel{color:#fff6de;text-shadow:0 1px 0 #3a1602,0 0 12px rgba(255,194,51,.95)}
/* inline-block para que el condensado de ultimo recurso pueda aplicarse */
.plate span,#p1NameTxt{display:inline-block;transform-origin:center}

/* --- panel del jugador --- */
#p1Box{position:absolute;display:flex;align-items:flex-end;justify-content:center;
  box-sizing:border-box;padding-bottom:6px}
#p1Sprite{max-width:97%;max-height:97%;object-fit:contain;opacity:0;
  filter:drop-shadow(0 10px 12px rgba(0,0,0,.7)) drop-shadow(0 0 26px rgba(255,140,40,.28))}
#p1Sprite.in{animation:p1In .62s cubic-bezier(.17,.88,.25,1.05) forwards}
@keyframes p1In{from{opacity:0;transform:translateY(46px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
#p1Sprite.idle{animation:p1Idle 2.9s ease-in-out infinite;opacity:1}
/* reposo de pelea: el peso sube y baja y el cuerpo gira apenas, como
   quien se sostiene en la punta de los pies esperando el primer golpe */
@keyframes p1Idle{
  0%{transform:translateY(0) rotate(-.55deg) scale(1)}
  50%{transform:translateY(-5px) rotate(.45deg) scale(1.014)}
  100%{transform:translateY(0) rotate(-.55deg) scale(1)}
}
#p1Glow{position:absolute;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse,rgba(255,180,70,.5),transparent 70%)}
#p1Glow.in{animation:p1Glow .7s ease-out}
@keyframes p1Glow{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.5)}}
#p1Hint.off{animation:none;opacity:0}
#p1Hint{position:absolute;display:flex;align-items:center;justify-content:center;
  transition:opacity .3s ease;
  font-size:12px;letter-spacing:.2em;color:#5d7fb8;text-align:center;pointer-events:none;
  animation:hintPulse 2.4s ease-in-out infinite}
@keyframes hintPulse{0%,100%{opacity:.5}50%{opacity:.95}}
#p1Name{position:absolute;display:flex;align-items:center;justify-content:center;
  font-family:Bungee,Impact,sans-serif;color:#ffeccd;white-space:nowrap;pointer-events:none;
  text-shadow:0 2px 0 #2a1204,0 0 16px rgba(255,150,50,.75)}
#p1Name.hit{animation:nmPop .34s cubic-bezier(.2,1.5,.4,1)}
@keyframes nmPop{0%{transform:scale(.72);filter:brightness(2.2)}100%{transform:scale(1);filter:none}}

/* --- continuar: la chapa esta pintada en el modulo; aqui va su estado --- */
#goBtn{position:absolute;padding:0;border:0;background:none;border-radius:16px;
  cursor:default;touch-action:manipulation;transition:transform .09s}
#goBtn.arm{cursor:pointer}
#goBtn::before{content:"";position:absolute;inset:4%;border-radius:12px;
  background:rgba(5,2,8,.66);transition:background .35s}
#goBtn.arm::before{background:rgba(5,2,8,0)}
#goBtn.arm{animation:goPulse 1.3s ease-in-out infinite}
@keyframes goPulse{0%,100%{filter:drop-shadow(0 0 0 rgba(255,150,40,0))}
  50%{filter:drop-shadow(0 0 16px rgba(255,160,50,.9))}}
#goBtn.arm:active{transform:translateY(4px) scale(.985)}
#goBtn .sheen{position:absolute;inset:6%;border-radius:10px;overflow:hidden;opacity:0}
#goBtn.arm .sheen{opacity:1}
#goBtn .sheen::after{content:"";position:absolute;top:-30%;bottom:-30%;width:26%;
  background:linear-gradient(105deg,transparent,rgba(255,240,200,.55),transparent);
  animation:sheen 3.4s ease-in-out 1s infinite}
@keyframes sheen{0%{left:-40%}55%{left:120%}100%{left:120%}}

#rotate{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;background:var(--ash);text-align:center;padding:24px}
#rotate.on{display:flex}
#rotate .ph{width:52px;height:86px;border:4px solid var(--ember);border-radius:9px;
  box-shadow:0 0 26px rgba(255,138,30,.45);animation:turn 1.9s ease-in-out infinite}
@keyframes turn{0%,38%{transform:rotate(0)}62%,100%{transform:rotate(-90deg)}}
#rotate h2{font-family:Bungee,Impact,sans-serif;font-size:19px;margin:0;color:var(--bone)}
#rotate p{margin:0;font-size:12px;color:var(--dim);letter-spacing:.06em}

:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}

<script>
"use strict";
var $ = function(id){ return document.getElementById(id); };
var REDUCE = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

var stage = $("stage");
var STAGE_W = 960, STAGE_H = 540;

/* ===========================================================
   EL REPARTO — UNA SOLA LISTA, y es el unico sitio que hay que tocar
   para sumar a alguien. Cada entrada necesita:

     id       da el nombre de sus DOS archivos:
                assets/p-<id>.webp  cuerpo entero, recortado al pixel
                assets/f-<id>.webp  rostro, proporcion 135x82 (la casilla)
     nom      como se escribe. La grilla lo pone en mayusculas sola:
              escribirlo dos veces es la forma segura de que un dia
              digan cosas distintas.
     w,h      medidas del dibujo de cuerpo entero en su tamano original.
              De aqui sale la escala COMPARTIDA, en la portada y en el
              panel del jugador: por eso las diferencias de estatura son
              las de verdad y no las de encajar a cada uno en su caja.
     portada  su puesto en la fila de la pantalla de inicio, o null si
              solo va en la grilla. En la portada caben SEIS: el septimo
              encoge a todos los demas, asi que a partir de ahi se entra
              con portada:null y se aparece solo en la seleccion.

   COMO SE FIJA EL ALTO, que es lo que decide si alguien "se ve mas
   grande". El alto de la tinta del dibujo NO sirve: incluye aureolas,
   boinas y melenas, asi que normalizar por el hace que a quien lleva
   algo encima se le encoja el cuerpo, y quien no lleva nada salga con
   el cuerpo entero. De ahi venia que Don Francis se viera mas grande.
   Lo que hace que un reparto se lea como UNO es que las CABEZAS midan
   parecido. Medido en un mismo cuadro, con todos a 234 px de alto:
   Don Francis 35 px de cara, Tatan 33, Pedrito 31, Don Alberto 31,
   La Primera 27 — un 30% de diferencia.
   Igualar las caras del todo daria alturas de 436 a 579 (33% de
   diferencia) y La Primera pasaria por encima de todos. Asi que se
   iguala CON TOPE: la altura se acerca a la que igualaria las caras
   pero se acota a [470, 530], un ±6% que se lee como estatura normal.
   Resultado: la disparidad de caras baja de 1,30 a 1,18 y la de
   estaturas se queda en 1,13.

   El orden de ESTA lista es el orden en que se escribio, y no significa
   nada: la grilla se ordena sola por nombre y la portada se sortea.
   Hay 30 casillas; de la 31 en adelante `armar()` avisa por consola.
   =========================================================== */
var PERSONAJES = [
  {id:"laprimera",  nom:"La Primera",   w:392, h:530, sexo:"m"},
  {id:"tatan",      nom:"Tatán",        w:410, h:477, sexo:"h"},
  {id:"lanaya",     nom:"La Naya",      w:412, h:488, sexo:"m"},
  {id:"kidd",       nom:"Kidd Tutú",    w:448, h:486, sexo:"h"},
  {id:"lamon",      nom:"La Mon",       w:418, h:515, sexo:"m"},
  {id:"elboris",    nom:"El Boris",     w:400, h:491, sexo:"h"},
  {id:"donfrancis", nom:"Don Francis",  w:390, h:470, sexo:"h"},
  {id:"eltono",     nom:"El Toño",      w:404, h:498, sexo:"h"},
  {id:"carter",     nom:"Mr. Carter",   w:386, h:484, sexo:"h"},
  {id:"felipito",   nom:"Felipito",     w:399, h:493, sexo:"h"},
  {id:"lamami",     nom:"La Mami",      w:343, h:485, sexo:"m"},
  {id:"soajanet",   nom:"La Soa Janet", w:362, h:488, sexo:"m"},
  {id:"tiaevelyn",  nom:"La Tía Evelyn",w:292, h:497, sexo:"m"},
  {id:"papurri",    nom:"El Papurri",   w:382, h:500, sexo:"h"},
  {id:"compadre",   nom:"El Compadre",  w:410, h:493, sexo:"h"},
  {id:"pedrito",    nom:"Pedrito",      w:426, h:530, sexo:"h"},
  {id:"donalberto", nom:"Don Alberto",  w:419, h:530, sexo:"h"}
];

/* ===========================================================
   LA GRILLA VA EN ORDEN ALFABETICO, siempre.
   Se DERIVA del nombre, no del orden en que se escribio la lista de
   arriba: asi sumar a alguien es pegar una linea donde caiga y la
   grilla se reordena sola. `localeCompare` con locale español para que
   Tatán y La Tía Evelyn caigan donde corresponde y no detras de la Z.
   =========================================================== */
var GRILLA = PERSONAJES.slice().sort(function(a, b){
  return a.nom.localeCompare(b.nom, "es", {sensitivity:"base"});
});

/* ===========================================================
   LA PORTADA SE SORTEA EN CADA CARGA: cinco, alternando hombre y
   mujer, centrados.

   No hay protagonista. Elegir seis fijos seria decidir quienes son los
   importantes, y en este juego todos lo son — asi que la fila cambia
   cada vez que se abre. Con 15 personajes hay miles de combinaciones, y
   crecen solas a medida que entra gente nueva: no hay nada que ajustar.

   Alterna h-m-h-m-h o m-h-m-h-m, eligiendo el arranque al azar entre
   los que la composicion del reparto permita. Hoy hay 9 hombres y 6
   mujeres, asi que los dos arranques son posibles; si algun dia no
   alcanzan, `portadaDelDia()` cae al que si se pueda armar y, si no hay
   ninguno, a una seleccion sin alternar antes que dejar la fila corta.
   =========================================================== */
var PORTADA_N = 5;

function revolver(a){                       /* Fisher-Yates */
  var i, j, t;
  for(i = a.length - 1; i > 0; i--){
    j = Math.floor(Math.random() * (i + 1));
    t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function portadaDelDia(n){
  n = n || PORTADA_N;
  var h = revolver(PERSONAJES.filter(function(p){ return p.sexo === "h"; }));
  var m = revolver(PERSONAJES.filter(function(p){ return p.sexo === "m"; }));
  /* cuantos hacen falta de cada uno segun con quien se empiece */
  function alcanza(primero){
    var a = primero === "h" ? h : m, b = primero === "h" ? m : h;
    return a.length >= Math.ceil(n/2) && b.length >= Math.floor(n/2);
  }
  var puede = ["h", "m"].filter(alcanza);
  if(!puede.length){
    /* el reparto no da para alternar: mejor cinco sin alternar que una
       fila corta, y la portada nunca se queda a medias */
    return revolver(PERSONAJES.slice()).slice(0, Math.min(n, PERSONAJES.length));
  }
  var primero = puede[Math.floor(Math.random() * puede.length)];
  var a = primero === "h" ? h : m, b = primero === "h" ? m : h, fila = [], i;
  for(i = 0; i < n; i++) fila.push(i % 2 === 0 ? a[i >> 1] : b[i >> 1]);
  return fila;
}

var CAST = portadaDelDia();
/* Busqueda por id sobre TODOS, no solo sobre la portada: quien no salga
   hoy en la fila igual necesita sus medidas para el panel derecho. */
var POR_ID = {};
PERSONAJES.forEach(function(p){ POR_ID[p.id] = p; });

/* La linea de suelo sale de un PRESUPUESTO, no de probar numeros:
   6 (aire) + 228 (logotipo) + 12 (hueco) + 234 (personajes) = 474, y lo
   que queda abajo —8 + 50 del boton + 8— es justo lo que pide la llamada
   a tocar ya crecida. Si se toca una de estas piezas hay que volver a
   cuadrar la suma; por eso estan todas escritas aqui y no repartidas. */
var FEET = 474;

(function buildCast(){
  var box = $("cast"), frag = document.createDocumentFragment();
  CAST.forEach(function(c, i){
    var sh = document.createElement("div");
    sh.className = "fsh"; sh.id = "sh-" + c.id; sh.setAttribute("aria-hidden","true");
    frag.appendChild(sh);
  });
  CAST.forEach(function(c, i){
    var f = document.createElement("div");
    f.className = "fig"; f.id = "fig-" + c.id;
    c.wait = 0.14 + i*0.075;                       /* la ola, de izquierda a derecha */
    c.dx = Math.round((i - (CAST.length-1)/2) * 5.6) + "px";
    f.style.animationDelay = c.wait + "s";
    f.style.setProperty("--dx", c.dx);
    var sw = document.createElement("div");
    sw.className = "sway";
    var im = document.createElement("img");
    im.src = "assets/p-" + c.id + ".webp"; im.alt = c.nom;
    sw.appendChild(im); f.appendChild(sw); frag.appendChild(f);
  });
  box.appendChild(frag);
})();

/* El mas alto de TODO el reparto. La escala se acota contra este numero
   y no contra el mas alto de los cinco que salieron hoy: si se midiera
   contra el subconjunto, un mismo personaje se veria de distinto tamano
   segun con quien le toque salir, y la fila cambiaria de escala en cada
   carga. Asi lo unico que cambia es QUIENES salen. */
var ALTO_MAYOR = 0;
PERSONAJES.forEach(function(p){ if(p.h > ALTO_MAYOR) ALTO_MAYOR = p.h; });
var ALTO_EN_PANTALLA = 234;                 /* lo que mide el mas alto */

function layout(){
  var W = STAGE_W, M = 24, G = 9, n = CAST.length, i;
  var sumW = 0; for(i=0;i<n;i++) sumW += CAST[i].w;
  /* una sola escala para los cinco: entran completos y sin pisarse */
  var k = (W - 2*M - G*(n-1)) / sumW;
  k = Math.min(k, ALTO_EN_PANTALLA / ALTO_MAYOR);
  var total = sumW*k + G*(n-1), x = (W - total)/2;
  for(i=0;i<n;i++){
    var c = CAST[i], w = c.w*k, h = c.h*k;
    var f = $("fig-"+c.id);
    f.style.cssText += ";left:"+Math.round(x)+"px;top:"+Math.round(FEET-h)+
                       "px;width:"+Math.round(w)+"px;height:"+Math.round(h)+"px";
    var sw = w*0.74, sh = $("sh-"+c.id);
    sh.style.cssText += ";left:"+Math.round(x+(w-sw)/2)+"px;top:"+(FEET-12)+
                        "px;width:"+Math.round(sw)+"px;height:16px";
    x += w + G;
  }
  /* La llamada a tocar se coloca DESDE la linea de suelo MEDIDA, y su
     resplandor se calca de la caja que acaba de resultar. Con el numero
     escrito a mano ya se sento una vez encima de unas botas: cualquier
     cambio de escala del reparto lo volvia a romper en silencio. */
  var cta = $("cta"), gl = $("ctaGlow"), yCta = FEET + 8;
  cta.style.top = yCta + "px";
  gl.style.cssText += ";top:" + (yCta + 3) + "px;width:" + Math.round(cta.offsetWidth * 0.95) +
                      "px;height:" + Math.max(12, cta.offsetHeight - 10) + "px";

  /* El hueco del logotipo se calcula contra el techo FIJO del reparto y
     no contra el mas alto de hoy: si no, el logotipo cambiaria de tamano
     segun a quien le tocara salir. */
  var tops = FEET - ALTO_EN_PANTALLA;
  var lw = Math.min(478, W*0.46), lh = lw*0.5953;
  if(lh > tops - 12){ lh = Math.max(148, tops - 12); lw = lh/0.5953; }
  var lg = $("logoWrap");
  lg.style.width = Math.round(lw)+"px"; lg.style.height = Math.round(lh)+"px";
  lg.style.left = Math.round((W-lw)/2)+"px"; lg.style.top = "6px";
}

function fit(){
  var vw = window.innerWidth, vh = window.innerHeight;
  /* el escenario se estira hasta el ancho real del telefono: asi la fila
     de seis respira y no quedan bandas negras a los lados */
  STAGE_W = Math.round(Math.min(1280, Math.max(960, 540 * (vw/vh))));
  stage.style.width = STAGE_W + "px";
  stage.style.transform = "translate(-50%,-50%) scale(" + Math.min(vw/STAGE_W, vh/540) + ")";
  $("rotate").classList.toggle("on", vh > vw * 1.02);
  layout();
  if(window.FX && FX.resize) FX.resize();
  if(window.SELFX && SELFX.resize) SELFX.resize();
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", function(){ setTimeout(fit, 120); });
fit();

/* ===========================================================
   AMBIENTE
   =========================================================== */
var A = {
  ctx:null, master:null, bus:null, verb:null, on:true, started:false, timers:[],
  init:function(){
    if(this.ctx) return true;
    var C = window.AudioContext || window.webkitAudioContext;
    if(!C) return false;
    try{ this.ctx = new C(); }catch(e){ return false; }
    this.master = this.ctx.createGain(); this.master.gain.value = 0;
    this.master.connect(this.ctx.destination);
    this.verb = this.ctx.createConvolver(); this.verb.buffer = this.impulse(2.6, 2.4);
    var vg = this.ctx.createGain(); vg.gain.value = 0.55;
    this.verb.connect(vg); vg.connect(this.master);
    this.bus = this.ctx.createGain(); this.bus.gain.value = 1;
    this.bus.connect(this.master); this.bus.connect(this.verb);
    return true;
  },
  live:function(){ return !!this.ctx && this.ctx.state === "running"; },
  impulse:function(dur, decay){
    var sr=this.ctx.sampleRate, n=Math.floor(sr*dur), b=this.ctx.createBuffer(2,n,sr);
    for(var c=0;c<2;c++){ var d=b.getChannelData(c);
      for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay); }
    return b;
  },
  noiseBuf:function(sec){
    var sr=this.ctx.sampleRate,n=Math.floor(sr*sec),b=this.ctx.createBuffer(1,n,sr),d=b.getChannelData(0),last=0;
    for(var i=0;i<n;i++){ var w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.2; }
    return b;
  },
  loopNoise:function(gain,type,freq,q){
    var s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf(4); s.loop=true;
    var f=this.ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; if(q) f.Q.value=q;
    var g=this.ctx.createGain(); g.gain.value=gain;
    s.connect(f); f.connect(g); g.connect(this.bus); s.start();
    return {gain:g, filt:f};
  },
  lfo:function(target,rate,depth,base){
    var o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.frequency.value=rate; g.gain.value=depth; target.value=base;
    o.connect(g); g.connect(target); o.start();
  },
  /* El pulso mudo es lo que de verdad destraba WebAudio en iPhone, y
     tiene que salir DENTRO del gesto. Sin esto, resume() responde que
     si y despues no suena nada. */
  unlock:function(){
    if(!this.init()) return false;
    try{
      var b = this.ctx.createBuffer(1, 1, 22050);
      var s = this.ctx.createBufferSource();
      s.buffer = b; s.connect(this.ctx.destination); s.start(0);
    }catch(e){}
    return true;
  },
  start:function(){
    if(this.started || !this.ctx) return;
    this.started = true;
    var t=this.ctx.currentTime;
    this.master.gain.setValueAtTime(0.0001,t);
    this.master.gain.linearRampToValueAtTime(this.on?0.85:0, t+1.4);
    var fire=this.loopNoise(0.30,"lowpass",520);
    this.lfo(fire.gain.gain,0.13,0.11,0.30); this.lfo(fire.filt.frequency,0.09,190,520);
    var far=this.loopNoise(0.085,"bandpass",1500,0.7); this.lfo(far.gain.gain,0.06,0.04,0.085);
    var rum=this.ctx.createOscillator(), rg=this.ctx.createGain();
    rum.type="sine"; rum.frequency.value=34; rg.gain.value=0.11;
    rum.connect(rg); rg.connect(this.bus); rum.start();
    this.lfo(rg.gain,0.077,0.07,0.11);
    var wind=this.loopNoise(0.05,"highpass",900); this.lfo(wind.gain.gain,0.041,0.035,0.05);
    var self=this;
    function every(min,max,fn){
      (function go(){
        self.timers.push(setTimeout(function(){ if(self.started){ fn(); go(); } },
          (min+Math.random()*(max-min))*1000));
      })();
    }
    every(0.10,0.55,function(){ self.crackle(); });
    every(6.5,14,function(){ self.groan(); });
    every(9,20,function(){ self.siren(); });
    every(13,26,function(){ self.chopper(); });
    every(7,17,function(){ self.boomFar(); });
    this.chopper(6);
  },
  crackle:function(){
    var t=this.ctx.currentTime, n=Math.floor(this.ctx.sampleRate*0.06);
    var b=this.ctx.createBuffer(1,n,this.ctx.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,6);
    var s=this.ctx.createBufferSource(); s.buffer=b;
    var f=this.ctx.createBiquadFilter(); f.type="bandpass";
    f.frequency.value=1200+Math.random()*3200; f.Q.value=1.4;
    var g=this.ctx.createGain(); g.gain.value=0.05+Math.random()*0.10;
    s.connect(f); f.connect(g); g.connect(this.bus); s.start(t);
  },
  groan:function(){
    var t=this.ctx.currentTime, dur=1.1+Math.random()*1.1;
    var o=this.ctx.createOscillator(), g=this.ctx.createGain(), f=this.ctx.createBiquadFilter();
    o.type="sawtooth"; var base=62+Math.random()*40;
    o.frequency.setValueAtTime(base,t); o.frequency.linearRampToValueAtTime(base*0.72,t+dur);
    var v=this.ctx.createOscillator(), vg=this.ctx.createGain();
    v.frequency.value=4.5+Math.random()*2.5; vg.gain.value=5;
    v.connect(vg); vg.connect(o.frequency); v.start(t); v.stop(t+dur+0.1);
    f.type="bandpass"; f.frequency.value=340+Math.random()*260; f.Q.value=3.2;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.055,t+0.35);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(f); f.connect(g); g.connect(this.bus); o.start(t); o.stop(t+dur+0.1);
  },
  siren:function(){
    var t=this.ctx.currentTime, dur=4.2;
    var o=this.ctx.createOscillator(), g=this.ctx.createGain(), f=this.ctx.createBiquadFilter();
    o.type="triangle"; f.type="lowpass"; f.frequency.value=900;
    o.frequency.setValueAtTime(470,t);
    for(var k=0;k<4;k++){
      o.frequency.linearRampToValueAtTime(620,t+k*1.05+0.52);
      o.frequency.linearRampToValueAtTime(470,t+k*1.05+1.05);
    }
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.02,t+1.2);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(f); f.connect(g); g.connect(this.verb); o.start(t); o.stop(t+dur+0.1);
  },
  chopper:function(dur){
    dur = dur || 7;
    var t=this.ctx.currentTime;
    var s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf(2); s.loop=true;
    var f=this.ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=420;

var sndBtn = $("sndBtn");
function paintSnd(){
  var viva = A.live(), son = viva && A.on;
  sndBtn.classList.toggle("on", son);          /* sonando */
  sndBtn.classList.toggle("muted", viva && !A.on);  /* silenciado a proposito */
  sndBtn.classList.toggle("locked", !viva);    /* el navegador aun no deja */
  sndBtn.setAttribute("aria-pressed", son ? "true" : "false");
  sndBtn.setAttribute("aria-label", son ? "Silenciar el sonido" : "Activar el sonido");
  sndBtn.title = son ? "Silenciar" : "Activar sonido";
}
/* Se reintenta varias veces por si el visor si concede el permiso: donde
   lo concede, el ambiente arranca junto con el video y nadie toca nada.
   Donde no, ningun codigo puede sonar antes de un toque. */
function tryUnlock(){ if(A.live()) return; wakeAudio(); }
/* resume() es asincrono: lo que dependa de que el audio quedo vivo tiene
   que engancharse a su promesa, no correr en la linea siguiente. */
function wakeAudio(alQuedarVivo){
  if(!A.unlock()) return;
  function listo(){
    if(A.on) A.start();
    paintSnd();
    if(alQuedarVivo) alQuedarVivo();
  }
  if(A.ctx.state === "suspended"){
    var pr = A.ctx.resume();
    if(pr && pr.then) pr.then(listo, function(){ paintSnd(); });
    else listo();
  } else listo();
}

/* ===========================================================
   FUEGO VIVO sobre el cuadro fijo
   Se saca del propio cuadro: se detectan los pixeles de llama y
   despues se les mueve el brillo. Asi la portada sigue ardiendo
   cuando el video ya termino, sin volver a decodificar nada.
   =========================================================== */
function makeFX(idLienzo, cuantasBrasas){
  var cv = $(idLienzo), cx = cv.getContext("2d");
  var SW = 240, SH = 135;
  var small = document.createElement("canvas"); small.width = SW; small.height = SH;
  var sc = small.getContext("2d");
  var mask = null, img = null, ready = false, running = false;
  var IW = 1920, IH = 1080;
  var emb = [], NE = REDUCE ? 0 : (cuantasBrasas || 62);
  function spawn(any){
    var W = cv.width || 960, H = cv.height || 540;
    return {x:Math.random()*W, y:any?Math.random()*H:H+5+Math.random()*50,
      r:0.6+Math.random()*2.1, vy:-(0.15+Math.random()*0.62),
      vx:(Math.random()-0.5)*0.35, a:0.25+Math.random()*0.65, p:Math.random()*6.3};
  }
  function resize(){
    cv.width = STAGE_W; cv.height = 540;
    if(emb.length === 0) for(var i=0;i<NE;i++) emb.push(spawn(true));
  }
  function build(src){
    IW = src.naturalWidth || 1920; IH = src.naturalHeight || 1080;
    sc.drawImage(src, 0, 0, SW, SH);
    var d = sc.getImageData(0,0,SW,SH).data;
    mask = new Float32Array(SW*SH);
    for(var y=0;y<SH;y++){
      /* el cielo tambien es naranjo: se deja fuera para que no titile */
      var ramp = Math.min(1, Math.max(0, (y/SH - 0.26) / 0.22));
      for(var x=0;x<SW;x++){
        var i4 = (y*SW+x)*4, r=d[i4], g=d[i4+1], b=d[i4+2];
        var v = 0;
        if(r > 135 && r - b > 45 && g > 55) v = Math.min(1, (r - b) / 140);
        if(r > 225 && g > 175) v = Math.max(v, 0.9);
        mask[y*SW+x] = v * ramp;
      }
    }
    img = sc.createImageData(SW, SH);
    ready = true;
  }
  var cxs = new Float32Array(SW), cxs2 = new Float32Array(SW);
  var cys = new Float32Array(SH), cys2 = new Float32Array(SH), cys3 = new Float32Array(SH);
  function frame(ts){
    if(!running) return;
    requestAnimationFrame(frame);
    var W = cv.width, H = cv.height, t = ts/1000, x, y;
    cx.clearRect(0,0,W,H);
    if(ready){
      for(x=0;x<SW;x++){ cxs[x]=Math.sin(x*0.185 - t*2.7); cxs2[x]=Math.sin(x*0.058 + t*1.9); }
      for(y=0;y<SH;y++){ cys[y]=Math.sin(y*0.105 + t*1.1); cys2[y]=Math.sin(y*0.265 - t*1.5);
                         cys3[y]=Math.sin(y*0.42 - t*4.1); }
      var dd = img.data;
      for(y=0;y<SH;y++){
        var base = y*SW;
        for(x=0;x<SW;x++){
          var m = mask[base+x];
          if(m < 0.02){ dd[(base+x)*4+3]=0; continue; }
          var v = 0.52 + 0.27*(cxs[x]*cys[y]) + 0.19*(cxs2[x]*cys2[y]) + 0.14*cys3[y];
          if(v < 0) v = 0; else if(v > 1.25) v = 1.25;
          var i4 = (base+x)*4;
          dd[i4] = 255; dd[i4+1] = 140 + 90*v; dd[i4+2] = 40 + 50*v;
          dd[i4+3] = m * v * 150;
        }
      }
      sc.putImageData(img, 0, 0);
      cx.globalCompositeOperation = "lighter";
      cx.imageSmoothingEnabled = true;
      /* el mismo encuadre "cover" que usa la imagen de fondo, para que
         las llamas caigan justo donde estan en el cuadro */
      var k = Math.max(W/IW, H/IH), dw = IW*k, dh = IH*k;
      cx.drawImage(small, (W-dw)/2, (H-dh)/2, dw, dh);
    }
    cx.globalCompositeOperation = "source-over";
    for(var i=0;i<emb.length;i++){
      var e = emb[i];
      e.y += e.vy; e.x += e.vx + Math.sin(e.p += 0.02)*0.24;
      if(e.y < -14) emb[i] = spawn(false);
      cx.fillStyle = "rgba(" + (e.r>1.6?"255,196,106":"255,124,32") + "," +
                     (e.a*(0.45+0.55*Math.sin(e.p*2))) + ")";
      cx.beginPath(); cx.arc(e.x, e.y, e.r, 0, 6.284); cx.fill();
    }
  }
  return {
    prepare:function(imgEl){ try{ build(imgEl); }catch(e){} },
    resize:resize,
    on:function(){ if(running) return; running = true; cv.classList.add("on"); requestAnimationFrame(frame); },
    off:function(){ running = false; cv.classList.remove("on"); }
  };
}

FX.resize(); SELFX.resize();

/* ===========================================================
   SECUENCIA
   =========================================================== */
var vid = $("vid"), anim = $("anim"), still = $("still");
var PARTS = ["logoWrap","bar","ctaGlow","cta","credits"];
var ended = false, playing = false, clock = [];

function titleOn(on){
  PARTS.forEach(function(id){ $(id).classList.toggle("in", on); });
  CAST.forEach(function(c, i){
    var f = $("fig-"+c.id), sh = $("sh-"+c.id), sw = f.querySelector(".sway");
    sh.style.transitionDelay = (c.wait + 0.55).toFixed(2) + "s";
    /* el balanceo arranca recien cuando el personaje ya aterrizo, para
       que no haya un tiron entre la entrada y el reposo */
    sw.style.animation = on
      ? "sway " + (3.9 + i*0.33).toFixed(2) + "s ease-in-out " +
        (c.wait + 1.0).toFixed(2) + "s infinite alternate"
      : "none";
    f.classList.toggle("in", on);
    sh.classList.toggle("in", on);
  });
}
function clearClock(){ clock.forEach(clearTimeout); clock = []; }

/* El destello es el corte de esta app: tapa el cambio de escena y da el
   golpe de vista. Estaba escrito tres veces con tres variantes; aqui va
   una sola, y `conAro` decide si ademas sale la onda expansiva. */
function fogonazo(conAro){
  var f = $("flash"), r = $("ring");
  f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  if(conAro){ r.classList.remove("go"); void r.offsetWidth; r.classList.add("go"); }
}

function toTitle(){
  if(ended) return;
  ended = true; playing = false; clearClock();
  fogonazo(true);
  A.titleHit();
  setTimeout(function(){
    still.classList.add("on");
    vid.classList.add("gone"); anim.classList.add("gone");
    setTimeout(function(){ try{ vid.pause(); }catch(e){} }, 380);
    titleOn(true);
    /* el fuego entra cuando la coreografia ya paso: durante la entrada
       el cuadro se dedica entero a mover el logotipo y los seis */
    clock.push(setTimeout(function(){ FX.on(); }, 1000));
    CAST.forEach(function(c, i){
      clock.push(setTimeout(function(){ A.step(i); }, (c.wait + 0.82) * 1000));
    });
  }, 90);
}

function armClock(ms){
  clearClock();
  clock.push(setTimeout(function(){ A.riser(); }, Math.max(0, ms - 620)));
  clock.push(setTimeout(toTitle, ms));
}

/* --- camino 2: WebP animado. Un <img> no depende del permiso de
       reproduccion automatica, asi que la intro siempre corre. --- */
function useAnim(){
  if(ended || playing) return;
  try{ vid.pause(); vid.removeAttribute("src"); vid.load(); }catch(e){}
  anim.onload = function(){
    if(ended) return;
    playing = true; anim.classList.add("on"); armClock(5000);
  };
  anim.onerror = function(){ toTitle(); };
  anim.src = "assets/intro-anim.webp";
}

function startVideo(){
  ended = false; playing = false; clearClock();
  titleOn(false); FX.off();
  still.classList.remove("on");
  vid.classList.remove("gone"); anim.classList.remove("gone"); anim.classList.remove("on");
  vid.muted = true; vid.defaultMuted = true; vid.playsInline = true;
  if(!vid.getAttribute("src") && !vid.querySelector("source")) { useAnim(); return; }
  try{ vid.currentTime = 0; }catch(e){}
  var p = vid.play();
  if(p && p.then){
    p.then(function(){
      playing = true;
      try{ vid.playbackRate = REDUCE ? 1 : 0.88; }catch(e){}
    }).catch(function(){
      setTimeout(function(){
        if(ended || playing) return;
        var q = vid.play();
        if(q && q.then) q.then(function(){
          playing = true;
          try{ vid.playbackRate = REDUCE ? 1 : 0.88; }catch(e){}
        }).catch(useAnim);
        else playing = true;
      }, 250);
    });
  } else playing = true;
  if(REDUCE) setTimeout(toTitle, 500);
}

var risen = false;
vid.addEventListener("timeupdate", function(){
  if(!vid.duration) return;
  var left = (vid.duration - vid.currentTime) / (vid.playbackRate || 1);
  if(!risen && left < 0.62){ risen = true; A.riser(); }
  if(vid.currentTime >= vid.duration - 0.06) toTitle();
});
vid.addEventListener("ended", toTitle);
vid.addEventListener("error", function(){ if(!ended && !playing) useAnim(); });

/* ---------- toque en cualquier parte ---------- */
function onTap(e){
  if(e && e.target && e.target.closest && e.target.closest("#tools")) return;
  /* Destrabar va PRIMERO: un toque es un gesto valido para el navegador
     aunque esta pantalla no haga nada con el, y desperdiciarlo deja el
     sonido apagado sin motivo. */
  wakeAudio();
  /* en la seleccion mandan sus propios controles: un toque al aire no
     puede elegir ni continuar por nadie */
  if(SEL.abierta) return;
  if(!ended){ toTitle(); return; }
  A.coin();
  SEL.entrar();          /* pone su propio destello: el corte es suyo */
}
document.addEventListener("pointerdown", onTap);
document.addEventListener("keydown", function(e){
  var f = document.activeElement;
  if(f && (f.tagName === "BUTTON" || f.tagName === "A")) return;
  if(e.key==="Enter"||e.key===" "){ e.preventDefault(); onTap(null); }
  if(e.key==="Escape" && SEL.abierta) SEL.salir();
});

/* Atender el toque en pointerdown y no solo en click: en el telefono un
   click se pierde con el minimo arrastre, y ademas pointerdown es el
   momento en que el navegador concede el permiso de sonido. El click
   queda de respaldo, sin repetir la accion. */
function alTocar(el, fn){
  var ultimo = 0;
  el.addEventListener("pointerdown", function(e){
    e.stopPropagation(); ultimo = Date.now(); fn(e);
  });
  el.addEventListener("click", function(e){
    e.stopPropagation();
    if(Date.now() - ultimo < 800) return;
    fn(e);
  });
}

alTocar(sndBtn, function(){
  /* Dos caminos que no se pueden mezclar:
     1) el audio todavia no esta destrabado -> destrabar y encender.
     2) ya esta vivo -> alternar encendido/apagado.
     Antes se forzaba A.on=true antes de alternar, asi que la alternancia
     siempre terminaba en apagado y el boton quedaba pegado. */
  if(!A.live()){
    A.on = true;
    wakeAudio(function(){
      A.blip();
      /* si la intro todavia corre, se vuelve al cuadro 0: asi el sonido
         y el video quedan juntos desde el principio, que es el punto */
      if(!ended){ risen = false; startVideo(); }
    });
    paintSnd();
    return;
  }
  A.on = !A.on;
  var t = A.ctx.currentTime;
  A.master.gain.cancelScheduledValues(t);
  A.master.gain.setValueAtTime(A.master.gain.value, t);
  if(A.on){
    A.start();
    A.master.gain.linearRampToValueAtTime(0.85, t + 0.22);
  } else {
    A.master.gain.linearRampToValueAtTime(0, t + 0.18);
  }
  paintSnd();
});
alTocar($("replayBtn"), function(){ wakeAudio(); risen = false; startVideo(); });
$("tools").addEventListener("pointerdown", function(e){ e.stopPropagation(); });

document.addEventListener("visibilitychange", function(){
  if(document.hidden){
    if(A.ctx && A.ctx.state==="running") A.ctx.suspend();
    try{ vid.pause(); }catch(e){}
  } else {
    if(A.on && A.ctx && A.ctx.state==="suspended") A.ctx.resume().then(function(){ A.start(); paintSnd(); }, function(){});
    else tryUnlock();
    if(!ended && playing){ try{ vid.play(); }catch(e){} }
  }
});

/* ===========================================================
   PANTALLA DE SELECCION
   El modulo es UNA imagen usada dos veces con recortes
   complementarios. Lo que baja es el recorte izquierdo; el panel
   del jugador es el derecho y nunca se mueve, porque tiene que
   estar ahi desde el primer cuadro.
   Toda la geometria va en PORCENTAJE del modulo: asi el ancho del
   escenario puede cambiar entre telefonos sin descolocar nada.
   =========================================================== */
var SEL = (function(){
  var COLX = [7.4163,17.1651,26.8541,36.5431,46.2321,55.9211];  /* x de las 6 columnas */
  var ROWY = [19.6599,35.9192,51.7535,68.3316,84.4846];         /* y de las 5 filas */
  var SW_ = 8.0144, SH_ = 8.7141;                               /* casilla */
  var PLX = [7.5957,17.2847,26.9737,36.6627,46.4115,56.1005];   /* x de los rotulos */
  var PLY = [28.7991,44.9522,61.2115,77.3645,93.4113];          /* y de los rotulos */
  var PW_ = 7.7153, PH_ = 3.2944;                               /* rotulo */

  var mod = $("selMod"), cort = $("curtain"), riel = $("rail");
  var caja = $("p1Box"), spr = $("p1Sprite"), pista = $("p1Hint");
  var nombre = $("p1Name"), nombreTxt = $("p1NameTxt"), destello = $("p1Glow");
  var go = $("goBtn"), pg = $("pg-sel"), cont = $("slots");
  var abierta = false, rodando = false, elegido = null, relojes = [];
  var armada = false, PK = 0;                 /* escala unica del reparto */
  var CASILLAS = COLX.length * ROWY.length;   /* 30 */

  function reloj(fn, ms){ relojes.push(setTimeout(fn, ms)); }
  function limpiar(){ relojes.forEach(clearTimeout); relojes = []; }
  /* Encoge el texto hasta que QUEPA, midiendo lo renderizado. La regla
     anterior deducia el cuerpo de letra del largo del nombre con umbrales
     escritos a mano, y "Don Francis" —el primer nombre que la puso a
     prueba— se paso 3,4 px de su placa. Con personajes entrando de a
     poco, acertar el umbral a ojo es cuestion de tiempo; medir no falla. */
  function encajar(caja, texto, base, minimo){
    var t = base, paso = base > 14 ? 0.6 : 0.3;
    texto.style.transform = "";            /* sin esto un reajuste se acumula */
    while(t > minimo){
      caja.style.fontSize = t.toFixed(2) + "px";
      if(texto.offsetWidth <= caja.clientWidth) return;
      t -= paso;
    }
    /* Por debajo del minimo la letra deja de leerse, asi que en vez de
       seguir bajando se CONDENSA en horizontal. Un nombre completo y
       angosto se lee; uno cortado no — y como la placa centra su texto,
       el recorte se comeria las DOS puntas a la vez. */
    caja.style.fontSize = minimo.toFixed(2) + "px";
    caja.style.letterSpacing = "-.03em";
    var mide = texto.offsetWidth, tope = caja.clientWidth;
    if(mide > tope) texto.style.transform = "scaleX(" + (tope/mide).toFixed(3) + ")";
  }
  function poner(el, x, y, w, h){
    el.style.left = x + "%"; el.style.top = y + "%";
    el.style.width = w + "%"; el.style.height = h + "%";
  }

  /* --- armar las 30 casillas una sola vez --- */
  /* Los rotulos se miden contra la tipografia que este cargada en ese
     momento. Si Bungee todavia no llego, lo medido fue la de respaldo y
     al llegar la buena los anchos cambian: hay que volver a ajustar.
     Sin esto, un nombre que aqui cabe justo se sale en el telefono. */
  function reajustarRotulos(){
    var pls = cont.querySelectorAll(".plate"), i;
    for(i = 0; i < pls.length; i++){
      if(!pls[i].firstChild) continue;
      pls[i].style.letterSpacing = ".02em";
      encajar(pls[i], pls[i].firstChild, 10, 6.4);
    }
    if(elegido){ nombre.style.letterSpacing = ""; encajar(nombre, nombreTxt, 21, 12); }
  }

  function armar(){
    if(armada) return; armada = true;
    if(GRILLA.length > CASILLAS && window.console)
      console.warn("Zombies en el 18: hay " + GRILLA.length +
                   " personajes y solo " + CASILLAS + " casillas.");
    var n = 0;
    for(var r = 0; r < ROWY.length; r++){
      for(var c = 0; c < COLX.length; c++, n++){
        var quien = GRILLA[n] || null;
        var b = document.createElement("button");
        b.className = "slot " + (quien ? "free" : "lock");
        b.type = "button";
        poner(b, COLX[c], ROWY[r], SW_, SH_);
        if(quien){
          var im = document.createElement("img");
          im.src = "assets/f-" + quien.id + ".webp"; im.alt = "";
          /* Si el rostro no esta, la casilla vuelve a ser una vacia en vez
             de quedar con el icono de imagen rota: al sumar personajes el
             olvido tipico es subir el cuerpo y no la cara. */
          im.onerror = (function(btn){ return function(){
            btn.className = "slot lock"; btn.tabIndex = -1;
            btn.setAttribute("aria-label", "Casilla bloqueada");
            btn.innerHTML = "";
          }; })(b);
          b.appendChild(im);
          b.setAttribute("aria-label", "Elegir a " + quien.nom);
          b.dataset.who = quien.id;
        } else {
          b.setAttribute("aria-label", "Casilla bloqueada");
          b.setAttribute("aria-disabled", "true");
          b.tabIndex = -1;
        }
        cont.appendChild(b);

        var pl = document.createElement("div");
        pl.className = "plate";
        poner(pl, PLX[c], PLY[r], PW_, PH_);
        if(quien){
          /* La mayuscula se calcula, no se escribe: el nombre vive una
             sola vez en PERSONAJES y aqui se muestra como toca. */
          var tx = document.createElement("span");
          tx.textContent = quien.nom.toUpperCase();
          pl.appendChild(tx);
          cont.appendChild(pl);
          pl.style.letterSpacing = ".02em";
          encajar(pl, tx, 10, 6.4);
          b.plate = pl;
        } else cont.appendChild(pl);

        (function(btn, quien2){
          alTocar(btn, function(){
            if(quien2) elegir(quien2, btn);
            else negar(btn);
          });
        })(b, quien);
      }
    }
    /* el panel del jugador, el rotulo y la chapa de continuar */
    poner(caja,   69.2584, 27.9490, 21.4115, 42.6142);
    poner(pista,  69.2584, 27.9490, 21.4115, 42.6142);
    poner(nombre, 65.7297, 73.5388, 28.8278,  8.9267);
    poner(go,     65.7895, 84.1658, 30.3828, 14.4527);
    poner(destello, 72.0, 40.0, 16.0, 26.0);

    /* una sola escala para los seis: la calcula el mas alto y el mas
       ancho contra la caja, y deja un 3% de aire para que el balanceo
       del reposo no roce el marco */
    var bw = caja.offsetWidth, bh = caja.offsetHeight, maxW = 0, maxH = 0;
    /* contra TODOS y no solo contra la portada: quien entre con
       portada:null tambien tiene que caber en este panel */
    PERSONAJES.forEach(function(c){ if(c.w > maxW) maxW = c.w; if(c.h > maxH) maxH = c.h; });
    /* 12 px de alto y un 5% de ancho quedan libres a proposito: el reposo
       de pelea gira y crece un poco, y sin ese aire el marco le cortaria
       un hombro justo en el cuadro mas alto del balanceo */
    PK = Math.min((bh - 12) / maxH, bw * 0.95 / maxW);
    alTocar(go, function(){ if(elegido) salir(); else { A.deny(); sacudir(); } });
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(reajustarRotulos);
  }

  var tShake = 0;
  function sacudir(){
    clearTimeout(tShake);
    mod.classList.remove("shake"); void mod.offsetWidth; mod.classList.add("shake");
    tShake = setTimeout(function(){ mod.classList.remove("shake"); }, 400);
  }

  function negar(btn){
    A.deny();
    btn.classList.remove("no"); void btn.offsetWidth; btn.classList.add("no");
    setTimeout(function(){ btn.classList.remove("no"); }, 320);
  }

  function elegir(quien, btn){
    if(elegido === quien.id){ A.pick(); return; }
    elegido = quien.id;
    A.pick();
    var todas = cont.querySelectorAll(".slot"), i;
    for(i = 0; i < todas.length; i++){
      todas[i].classList.remove("sel");
      if(todas[i].plate) todas[i].plate.classList.remove("sel");
    }
    void btn.offsetWidth;
    btn.classList.add("sel");
    if(btn.plate) btn.plate.classList.add("sel");

    pista.classList.add("off");
    destello.classList.remove("in"); void destello.offsetWidth; destello.classList.add("in");
    /* se cambia la imagen con la entrada apagada y se vuelve a encender:
       si no, el segundo personaje aparece ya colocado y sin entrada */
    spr.classList.remove("in", "idle");
    var med = POR_ID[quien.id];
    if(med && PK){
      spr.style.width  = Math.round(med.w * PK) + "px";
      spr.style.height = Math.round(med.h * PK) + "px";
    }
    spr.src = "assets/p-" + quien.id + ".webp";
    void spr.offsetWidth;
    spr.classList.add("in");
    reloj(function(){ spr.classList.remove("in"); spr.classList.add("idle"); }, 640);

    nombreTxt.textContent = quien.nom.toUpperCase();
    nombre.style.letterSpacing = "";
    encajar(nombre, nombreTxt, 21, 12);
    nombre.classList.remove("hit"); void nombre.offsetWidth; nombre.classList.add("hit");

    go.classList.add("arm");
    go.setAttribute("aria-disabled", "false");
    go.setAttribute("aria-label", "Continuar con " + quien.nom);
  }

  /* --- la cortina --- */
  function bajarCortina(){
    rodando = true;
    cort.classList.remove("roll"); riel.classList.remove("roll");
    void cort.offsetWidth; void riel.offsetWidth;
    A.shutter(0.88);
    cort.classList.add("roll"); riel.classList.add("roll");
    /* el 74% del recorrido es donde toca el suelo por primera vez:
       ahi va el golpe, no al final de la animacion */
    reloj(function(){ A.clang(1); sacudir(); }, 874);
    reloj(function(){ A.clang(0.34); }, 1180);      /* el asiento del rebote */
    reloj(function(){ rodando = false; }, 1220);
  }

  /* El cambio de pantalla es un CORTE tapado por el destello, no un
     fundido entre las dos. Dos razones y las dos pesan:
     - Es el idioma de una recreativa. Las maquinas cortan; fundir suena
       a presentacion de diapositivas.
     - Un fundido obliga al telefono a dibujar las DOS escenas a la vez
       durante medio segundo, con sus dos lienzos de fuego y sus dos
       fondos. Era el momento mas caro de toda la app, y era evitable.
     El destello llega a su maximo a los 52 ms y sigue casi entero hasta
     pasados los 300, asi que el cambio a los 110 ocurre a plena luz. */
  function entrar(){
    if(abierta) return;
    abierta = true; limpiar();
    armar();
    if(!SELFXlisto) prepararFuego();
    traerCuerpos();
    fogonazo(true);
    reloj(function(){
      pg.classList.add("on");
      titleOn(false); FX.off();                /* la portada se apaga bajo el destello */
      $("replayBtn").style.display = "none";   /* la intro no se repite desde aqui */
      SELFX.on();
    }, 70);
    reloj(bajarCortina, 330);
  }

  function salir(){
    if(!abierta) return;
    abierta = false; limpiar();
    A.goHit();
    fogonazo(true);
    /* mismo corte al volver, y la coreografia de la portada arranca
       DENTRO del destello: al apagarse, los seis ya vienen subiendo */
    reloj(function(){
      pg.classList.remove("on");
      SELFX.off();
      titleOn(true); FX.on();
      $("replayBtn").style.display = "";
      CAST.forEach(function(c, i){
        reloj(function(){ A.step(i); }, (c.wait + 0.82) * 1000);
      });
    }, 70);
    /* la cortina se rearma cuando ya no se ve, para que no se vea subir */
    reloj(function(){
      cort.classList.remove("roll"); riel.classList.remove("roll");
    }, 200);
  }

  /* El cuerpo entero de quienes NO salen en la portada se pide al ENTRAR
     aqui, no al arrancar la app. Son ~50 KB cada uno y el reparto crece:
     al arrancar serian cientos de KB de datos moviles gastados en gente
     que quizas nadie llegue a mirar. Aqui hay 1,2 s de cortina por
     delante y el gesto ya dijo que esta eligiendo. Los de la portada no
     hacen falta: la pantalla de inicio ya los trajo. */
  var cuerposPedidos = false;
  function traerCuerpos(){
    if(cuerposPedidos) return; cuerposPedidos = true;
    PERSONAJES.forEach(function(c){
      if(c.portada === null || c.portada === undefined){
        var i = new Image(); i.src = "assets/p-" + c.id + ".webp";
      }
    });
  }

  /* el fuego de la fonda se saca del propio fondo, igual que en la
     portada: nada que descargar y las llamas caen donde de verdad estan */
  var SELFXlisto = false;
  function prepararFuego(){
    var bg = $("selBg");
    function ya(){ SELFX.prepare(bg); SELFXlisto = true; }
    if(bg.complete && bg.naturalWidth) ya();
    else bg.addEventListener("load", ya, {once:true});
  }

  return {
    entrar:entrar, salir:salir,
    get abierta(){ return abierta; },
    get rodando(){ return rodando; }
  };
})();

/* ---------- arranque ---------- */
paintSnd();
wakeAudio();
[220, 900, 2200, 4200].forEach(function(d){ setTimeout(tryUnlock, d); });
if(still.complete) FX.prepare(still);
else still.addEventListener("load", function(){ FX.prepare(still); }, {once:true});

/* Las piezas de la segunda pantalla se traen mientras corre la intro,
   no cuando se toca: el modulo son 360 KB y la cortina tiene que poder
   bajar en el cuadro siguiente al toque, no medio segundo despues. */
setTimeout(function(){
  var lista = ["sel-mod.webp", "sel-bg.webp"];
  /* Solo los ROSTROS: son ~16 KB y tienen que estar en el cuadro en que
     la cortina termina de subir. La lista sale de PERSONAJES y no escrita
     a mano: sumar a alguien y olvidar su cara daria una casilla en blanco
     el primer segundo. Los CUERPOS ya no vienen de aqui — ver abajo. */
  PERSONAJES.forEach(function(c){ lista.push("f-" + c.id + ".webp"); });
  lista.forEach(function(n){ var i = new Image(); i.src = "assets/" + n; });
}, 1600);

startVideo();
setTimeout(function(){ if(!ended && !playing) startVideo(); }, 900);
setTimeout(function(){ if(!ended && !playing) useAnim(); }, 2200);

/* Registro del service worker. Solo sirve en hosting real: en el
   artefacto la pagina vive en un contexto aislado y falla, asi que se
   ignora en silencio en vez de ensuciar la consola. */
if("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
